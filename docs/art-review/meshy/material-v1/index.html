<!doctype html><html lang="tr"><meta charset="utf-8"><title>Clockin robot · Malzeme karşılaştırması</title><style>body{margin:0;background:#171b24;color:#eee;font:15px system-ui}header{padding:18px 24px}h1{font-size:20px;margin:0 0 10px}button{padding:9px 12px;background:#303747;border:1px solid #586175;border-radius:8px;color:white;cursor:pointer}button.active{background:#a94700}#views{display:flex;height:76vh}.view{width:50%;position:relative}.label{position:absolute;top:10px;left:20px;z-index:1}canvas{display:block;width:100%;height:100%}#status{padding:12px 24px;color:#bbb}p{margin:8px 0;color:#c3c8d2}</style><header><h1>Clockin · İlk kaplama korunarak malzeme ayarı</h1><p>Sürükleyerek döndür · Tekerlekle yakınlaştır · İki model aynı kamera ve ışığı kullanır.</p><button id="front">Ön</button> <button id="side">Yan</button> <button id="back">Arka</button> <button id="lit" class="active">Stüdyo ışığı</button> <button id="flat">Yalın renk</button></header><div id="views"><div class="view" id="a"><span class="label">Orijinal</span></div><div class="view" id="b"><span class="label">Malzeme v1</span></div></div><div id="status">Modeller yükleniyor…</div><script type="importmap">{"imports":{"three":"./three.module.js"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from './GLTFLoader.js';import {OrbitControls} from './OrbitControls.js';import {RoomEnvironment} from './RoomEnvironment.js';
const entries=[];let sync=false;
for(const [id,url] of [['a','original.glb'],['b','happy-robot-material-v1.glb']]){
 const div=document.getElementById(id),r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1;div.append(r.domElement);
 const s=new T.Scene();s.background=new T.Color('#202633');const c=new T.PerspectiveCamera(33,1,.01,100);c.position.set(0,0.12,3.8);const controls=new OrbitControls(c,r.domElement);controls.target.set(0,0,0);controls.enableDamping=false;controls.update();const pm=new T.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;s.environmentIntensity=.8;
 const key=new T.DirectionalLight(0xfff1df,2.1);key.position.set(-3,5,4);s.add(key);const fill=new T.DirectionalLight(0xd7eaff,.8);fill.position.set(4,1,2);s.add(fill);
 const gltf=await new GLTFLoader().loadAsync(url);s.add(gltf.scene);const box=new T.Box3().setFromObject(gltf.scene);gltf.scene.position.sub(box.getCenter(new T.Vector3()));const mats=[];gltf.scene.traverse(o=>{if(o.isMesh){mats.push([o,o.material,new T.MeshBasicMaterial({map:o.material.map,vertexColors:!!o.geometry.attributes.color,side:T.DoubleSide})]);}});
 const e={r,s,c,controls,div,mats};entries.push(e);controls.addEventListener('change',()=>{if(sync)return;sync=true;for(const v of entries){if(v===e)continue;v.c.position.copy(c.position);v.controls.target.copy(controls.target);v.controls.update();}sync=false;});
}
for(const [id,pos] of [['front',[0,.12,3.8]],['side',[3.8,.12,0]],['back',[0,.12,-3.8]]])document.getElementById(id).onclick=()=>{for(const e of entries){e.c.position.set(...pos);e.controls.target.set(0,0,0);e.controls.update();}};
for(const id of ['lit','flat'])document.getElementById(id).onclick=()=>{for(const e of entries)for(const [o,p,b]of e.mats)o.material=id==='flat'?b:p;document.getElementById('lit').classList.toggle('active',id==='lit');document.getElementById('flat').classList.toggle('active',id==='flat');};
document.getElementById('status').textContent='2 model yüklendi · Her model 632.548 üçgen · Geometri ve üç kaplama dosyası aynı';
function draw(){requestAnimationFrame(draw);for(const e of entries){const w=e.div.clientWidth,h=e.div.clientHeight;if(e.r.domElement.width!==w*e.r.getPixelRatio()||e.r.domElement.height!==h*e.r.getPixelRatio()){e.r.setSize(w,h,false);e.c.aspect=w/h;e.c.updateProjectionMatrix();}e.r.render(e.s,e.c);}}draw();
</script></html>
